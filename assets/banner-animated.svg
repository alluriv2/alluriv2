<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Vaibhav Alluri, Data Engineer. Things flow. Things fail. Resilient systems recover. Animation: events move through Ingest, Stream, Process, Persist and Serve; a failed event at Process is retried and replayed back into Process.">
<style>
@keyframes n1{0.0%{transform:translate(0px,0);opacity:0}20.0%{transform:translate(0px,0);opacity:0}22.857%{transform:translate(34.8px,0);opacity:1}70.344%{transform:translate(613.2px,0);opacity:1}73.201%{transform:translate(648px,0);opacity:0}100.0%{transform:translate(0px,0);opacity:0}}
