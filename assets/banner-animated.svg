.n4{animation:n4 7.0s linear infinite}
@keyframes fail{0.0%{transform:translate(0px,0px);fill:#58a6ff;opacity:0}2.857%{transform:translate(0px,0px);fill:#58a6ff;opacity:1}27.143%{transform:translate(322px,0px);fill:#58a6ff;opacity:1}30.0%{transform:translate(322px,0px);fill:#f778ba;opacity:1}30.714%{transform:translate(322px,0px);fill:#f778ba;opacity:1}39.286%{transform:translate(322px,110px);fill:#f778ba;opacity:1}45.0%{transform:translate(322px,110px);fill:#f778ba;opacity:1}49.286%{transform:translate(322px,110px);fill:#a371f7;opacity:1}54.286%{transform:translate(222px,110px);fill:#a371f7;opacity:1}56.714%{transform:translate(190px,110px);fill:#a371f7;opacity:1}63.571%{transform:translate(190px,0px);fill:#a371f7;opacity:1}65.714%{transform:translate(222px,0px);fill:#58a6ff;opacity:1}72.857%{transform:translate(322px,0px);fill:#58a6ff;opacity:1}97.143%{transform:translate(648px,0px);fill:#58a6ff;opacity:1}100.0%{transform:translate(648px,0px);fill:#58a6ff;opacity:0}}
.fail{animation:fail 7.0s linear infinite}
@keyframes health{0.0%{fill:#3fb950}29.286%{fill:#3fb950}31.0%{fill:#f778ba}72.857%{fill:#f778ba}75.0%{fill:#3fb950}100.0%{fill:#3fb950}}
.health{animation:health 7.0s linear infinite}
@keyframes procstroke{0.0%{stroke:#2f81f7}27.857%{stroke:#2f81f7}30.0%{stroke:#f778ba}72.857%{stroke:#f778ba}75.0%{stroke:#2f81f7}100.0%{stroke:#2f81f7}}
.procnode{animation:procstroke 7.0s linear infinite}
@keyframes recpink{0.0%{opacity:0.38}30.0%{opacity:0.38}33.571%{opacity:1}47.143%{opacity:1}51.429%{opacity:0.38}100.0%{opacity:0.38}}
.recpink{animation:recpink 7.0s linear infinite}
@keyframes recpurple{0.0%{opacity:0.38}47.857%{opacity:0.38}51.429%{opacity:1}66.429%{opacity:1}70.714%{opacity:0.38}100.0%{opacity:0.38}}
.recpurple{animation:recpurple 7.0s linear infinite}
.static{display:none}
.recpink,.recpurple{opacity:.55}
@media (prefers-reduced-motion: reduce){
  .moving{display:none}
  .static{display:inline}
  .health,.procnode,.recpink,.recpurple{animation:none}
}
</style>
